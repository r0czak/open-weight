name: Release

# Pushing a version tag (v1.6.0) builds, tests and publishes a GitHub Release with the APK.
# The tag must match the app's versionName, so the release and the installed app agree.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi

      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="open-weight-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          {
            echo "Open Weight ${GITHUB_REF_NAME#v}. Download \`$apk\` on your phone and open it; it installs over earlier builds and keeps your data."
            echo
            echo "Signed with the project's shared debug key (not a store release). SHA-256: \`$sha\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Open Weight ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
